name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Ask GitHub Pages where the site is served: a custom domain (e.g. javiergil.dev) or
      # <owner>.github.io build at the root, any other repo under /<repo-name>.
      - id: pages
        uses: actions/configure-pages@v5
      - name: Configure site paths
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        # Pages reports http:// until "Enforce HTTPS" is on; the site is always served over HTTPS.
        run: |
          url="${BASE_URL%/}"
          echo "NEXT_PUBLIC_BASE_PATH=${BASE_PATH%/}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=https://${url#http*://}" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
